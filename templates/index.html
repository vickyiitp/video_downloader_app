{% extends 'base.html' %}
{% load static %}

{% block content %}
<main>
    <div class="downloader-form">
        <div class="input-group">
            <label for="video-url" class="input-label">
                <i class="fas fa-link"></i> Video URL
            </label>
            <input type="text" id="video-url" placeholder="Paste any video URL here..." required>
        </div>

        <div class="input-group">
            <label for="cookie-data" class="input-label">
                <i class="fas fa-cookie-bite"></i> Cookies <span class="optional-tag">optional</span>
            </label>
            <textarea id="cookie-data" rows="3" placeholder="Paste cookies.txt content here (for private/protected videos)"></textarea>
        </div>

        <button id="fetch-btn" onclick="fetchInfo()">
            <i class="fas fa-search"></i> Fetch Video
        </button>
    </div>

    <!-- Status Area -->
    <div id="status-area" style="display: none;">
        <div id="status-icon"></div>
        <p id="status-text"></p>
    </div>

    <!-- Video Preview Card -->
    <div id="video-preview" style="display: none;">
        <div class="preview-thumbnail-wrap">
            <img id="preview-thumbnail" src="" alt="Video Thumbnail">
            <span id="preview-duration" class="preview-duration-badge"></span>
        </div>
        <div class="preview-info">
            <h3 id="preview-title"></h3>
            <p id="preview-site" class="preview-site-tag"><i class="fas fa-globe"></i> <span></span></p>
            <p id="preview-channel"><i class="fas fa-user"></i> <span></span></p>
            <p id="preview-views"><i class="fas fa-eye"></i> <span></span></p>
        </div>
        <button id="download-btn" onclick="startDownload()">
            <i class="fas fa-download"></i> Download Video
        </button>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
    const urlInput = document.getElementById('video-url');
    const cookieInput = document.getElementById('cookie-data');
    const fetchBtn = document.getElementById('fetch-btn');
    const downloadBtn = document.getElementById('download-btn');
    const statusArea = document.getElementById('status-area');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');
    const previewCard = document.getElementById('video-preview');

    let currentVideoUrl = '';

    function showStatus(type, message) {
        statusArea.style.display = 'flex';
        statusArea.className = 'status-' + type;

        if (type === 'loading') {
            statusIcon.innerHTML = '<div class="spinner"></div>';
        } else if (type === 'success') {
            statusIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
        } else {
            statusIcon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
        }

        statusText.innerText = message;
    }

    function hideStatus() {
        statusArea.style.display = 'none';
    }

    function formatViews(count) {
        if (!count) return null;
        if (count >= 1_000_000_000) return (count / 1_000_000_000).toFixed(1) + 'B views';
        if (count >= 1_000_000) return (count / 1_000_000).toFixed(1) + 'M views';
        if (count >= 1_000) return (count / 1_000).toFixed(1) + 'K views';
        return count.toLocaleString() + ' views';
    }

    function fetchInfo() {
        const url = urlInput.value.trim();
        if (!url) {
            showStatus('error', 'Please paste a video URL first.');
            urlInput.focus();
            return;
        }

        const cookies = cookieInput.value.trim();
        currentVideoUrl = url;
        previewCard.style.display = 'none';

        fetchBtn.disabled = true;
        fetchBtn.innerHTML = '<div class="btn-spinner"></div> Fetching...';
        showStatus('loading', 'Fetching video info...');

        fetch('/api/info/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, cookies: cookies }),
        })
        .then(res => {
            if (!res.ok) {
                return res.json().then(err => Promise.reject(err));
            }
            return res.json();
        })
        .then(data => {
            hideStatus();

            // Populate preview card
            const thumbImg = document.getElementById('preview-thumbnail');
            if (data.thumbnail) {
                thumbImg.src = data.thumbnail;
                thumbImg.style.display = 'block';
            } else {
                thumbImg.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80';
                thumbImg.style.display = 'block';
            }

            document.getElementById('preview-title').textContent = data.title;
            document.getElementById('preview-site').querySelector('span').textContent = data.site || 'Web Video';
            document.getElementById('preview-duration').textContent = data.duration;
            document.getElementById('preview-channel').querySelector('span').textContent = data.channel;

            const viewsEl = document.getElementById('preview-views');
            const formattedViews = formatViews(data.view_count);
            if (formattedViews) {
                viewsEl.querySelector('span').textContent = formattedViews;
                viewsEl.style.display = '';
            } else {
                viewsEl.style.display = 'none';
            }

            // Show preview with animation
            previewCard.style.display = 'flex';
        })
        .catch(err => {
            console.error(err);
            showStatus('error', err.message || 'Failed to fetch video info.');
        })
        .finally(() => {
            fetchBtn.disabled = false;
            fetchBtn.innerHTML = '<i class="fas fa-search"></i> Fetch Video';
        });
    }

    function startDownload() {
        if (!currentVideoUrl) return;

        const cookies = cookieInput.value.trim();

        showStatus('loading', 'Preparing download... Check your browser download bar once server finishes processing.');

        // Submit form natively so browser handles native file save / Save As prompt
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/api/download/';

        const urlInputForm = document.createElement('input');
        urlInputForm.type = 'hidden';
        urlInputForm.name = 'url';
        urlInputForm.value = currentVideoUrl;
        form.appendChild(urlInputForm);

        if (cookies) {
            const cookieInputForm = document.createElement('input');
            cookieInputForm.type = 'hidden';
            cookieInputForm.name = 'cookies';
            cookieInputForm.value = cookies;
            form.appendChild(cookieInputForm);
        }

        document.body.appendChild(form);
        form.submit();
        form.remove();

        setTimeout(() => {
            showStatus('success', 'Download requested! Server is downloading & sending file to your browser.');
        }, 3000);
    }

    urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') fetchInfo();
    });
</script>
{% endblock %}
